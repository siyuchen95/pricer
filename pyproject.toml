[project]
name = "pricer"
version = "0.1.0"
description = "Mid-frequency crypto pricing models on mdfeed market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
